# Redis Sentinel konfigürasyonu
# Master adı: mymaster — backend ve Celery bu ismi kullanır

sentinel monitor mymaster redis 6379 2
sentinel down-after-milliseconds mymaster 5000
sentinel failover-timeout mymaster 30000
sentinel parallel-syncs mymaster 1

# Docker network'ünde hostname çözümlemesi için gerekli
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

# Sentinel bu dosyayı güncelleyebilmeli (dinamik state için writable mount gerekir)
# docker-compose'da volume olarak mount edilmeli, :ro olmadan
