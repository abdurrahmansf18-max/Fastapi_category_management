global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alertmanager bağlantısı
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Uyarı kuralı dosyaları
rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Redis Exporter (redis-exporter container eklenirse aktif olur)
  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]
