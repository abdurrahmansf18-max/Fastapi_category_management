name: fastapi-prod

# ── Paylaşılan tanımlar ──────────────────────────────────────────────
x-backend-build: &backend-build
  build:
    context: ./backend
    dockerfile: Dockerfile

x-backend-env: &backend-env
  ENVIRONMENT: ${ENVIRONMENT:-production}
  DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@pgbouncer:5432/${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  MEILISEARCH_URL: http://meilisearch:7700
  MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY}
  SECRET_KEY: ${SECRET_KEY}
  APP_PUBLIC_BASE_URL: https://${APP_DOMAIN}
  API_PUBLIC_PREFIX: /api
  CORS_ORIGINS: '["https://${APP_DOMAIN}"]'
  TRUSTED_HOSTS: '["${APP_DOMAIN}","backend","localhost","127.0.0.1"]'
  COOKIE_SECURE: "true"
  COOKIE_SAMESITE: lax
  PUBLIC_CACHE_ETAG_MAX_BYTES: ${PUBLIC_CACHE_ETAG_MAX_BYTES:-262144}
  PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL}
  PLATFORM_OWNER_PASSWORD_HASH: ${PLATFORM_OWNER_PASSWORD_HASH}
  PLATFORM_OWNER_TOTP_SECRET: ${PLATFORM_OWNER_TOTP_SECRET}
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER}
  SMTP_PASSWORD: ${SMTP_PASSWORD}
  SMTP_FROM: ${SMTP_FROM}
  SENTRY_DSN: ${SENTRY_DSN}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-docs-platform}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}
  # Redis Sentinel — boş bırakılırsa REDIS_URL doğrudan kullanılır
  REDIS_SENTINEL_HOSTS: redis-sentinel-1:26379,redis-sentinel-2:26379,redis-sentinel-3:26379
  REDIS_SENTINEL_MASTER: mymaster

# ── Servisler ────────────────────────────────────────────────────────
services:
  caddy:
    build:
      context: ./infra/caddy
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - APP_DOMAIN=${APP_DOMAIN}
      - ACME_EMAIL=${ACME_EMAIL}
      - CROWDSEC_BOUNCER_API_KEY=${CROWDSEC_BOUNCER_API_KEY}
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    depends_on:
      - frontend
      - backend
      - crowdsec

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_BACKEND_ORIGIN: http://backend:8000
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_BACKEND_ORIGIN=http://backend:8000
      - NEXT_INTERNAL_API_BASE=http://backend:8000
      - NEXT_PUBLIC_API_BASE=/api
      - NEXT_PUBLIC_SITE_URL=https://${APP_DOMAIN}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      backend:
        condition: service_healthy

  backend:
    <<: *backend-build
    restart: unless-stopped
    environment:
      <<: *backend-env
      OPS_STATUS_DIR: /ops-status
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      # Güvenilir proxy katman sayısı (Caddy=1)
      TRUSTED_PROXY_COUNT: "1"
    volumes:
      - uploads:/app/uploads
      - ops_status:/ops-status:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      pgbouncer:
        condition: service_started

  # Migrate doğrudan PostgreSQL'e bağlanır — PgBouncer transaction mode DDL ile uyumsuz
  migrate:
    <<: *backend-build
    restart: "no"
    command: ["python", "run_migration.py"]
    environment:
      <<: *backend-env
      # PgBouncer bypass — DDL migration'ları doğrudan postgres'e
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *backend-build
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      <<: *backend-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      - backend
      - redis
      - meilisearch

  beat:
    <<: *backend-build
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      <<: *backend-env
    depends_on:
      - redis
      - worker

  # ── Veritabanı Katmanı ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=512MB", "-c", "max_connections=200", "-c", "log_min_duration_statement=500"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  pgbouncer:
    image: edoburu/pgbouncer:1.23.1
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=1000
      - DEFAULT_POOL_SIZE=50
      - AUTH_TYPE=scram-sha-256
    depends_on:
      postgres:
        condition: service_healthy

  # ── Redis HA (Master + Replica + 3 Sentinel) ──────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly yes
      - --appendfsync everysec
      - --save 900 1
      - --save 300 10
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-replica:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --replicaof redis 6379
      - --appendonly yes
      - --appendfsync everysec
    volumes:
      - redis_replica_data:/data
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Her sentinel kendi volume'una yazar — paylaşılan dosya yok
  redis-sentinel-1:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/sentinel-entrypoint.sh"]
    volumes:
      - ./infra/redis/sentinel-template.conf:/etc/redis/sentinel-template.conf:ro
      - ./infra/redis/sentinel-entrypoint.sh:/scripts/sentinel-entrypoint.sh:ro
      - sentinel_1_data:/data
    depends_on:
      redis:
        condition: service_healthy
      redis-replica:
        condition: service_healthy

  redis-sentinel-2:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/sentinel-entrypoint.sh"]
    volumes:
      - ./infra/redis/sentinel-template.conf:/etc/redis/sentinel-template.conf:ro
      - ./infra/redis/sentinel-entrypoint.sh:/scripts/sentinel-entrypoint.sh:ro
      - sentinel_2_data:/data
    depends_on:
      redis:
        condition: service_healthy
      redis-replica:
        condition: service_healthy

  redis-sentinel-3:
    image: redis:7-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/sentinel-entrypoint.sh"]
    volumes:
      - ./infra/redis/sentinel-template.conf:/etc/redis/sentinel-template.conf:ro
      - ./infra/redis/sentinel-entrypoint.sh:/scripts/sentinel-entrypoint.sh:ro
      - sentinel_3_data:/data
    depends_on:
      redis:
        condition: service_healthy
      redis-replica:
        condition: service_healthy

  redis-exporter:
    image: oliver006/redis_exporter:latest
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://redis:6379
    expose:
      - "9121"
    depends_on:
      redis:
        condition: service_healthy

  # ── Arama ──────────────────────────────────────────────────────────
  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_API_KEY}
      - MEILI_ENV=production
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:7700/health"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ── Gözlemlenebilirlik ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - alertmanager

  alertmanager:
    build:
      context: ./infra/alertmanager
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      - ALERTMANAGER_SMTP_HOST=${SMTP_HOST}
      - ALERTMANAGER_SMTP_PORT=${SMTP_PORT:-587}
      - ALERTMANAGER_SMTP_USER=${SMTP_USER}
      - ALERTMANAGER_SMTP_PASSWORD=${SMTP_PASSWORD}
      - ALERTMANAGER_SMTP_FROM=${SMTP_FROM}
      - ALERTMANAGER_ADMIN_EMAIL=${PLATFORM_OWNER_EMAIL}
    volumes:
      - ./infra/alertmanager/alertmanager.yml.tpl:/etc/alertmanager/alertmanager.yml.tpl:ro
      - alertmanager_data:/alertmanager
    expose:
      - "9093"

  grafana:
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.3.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:3.3.1
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
    depends_on:
      - loki

  # ── Backup & Güvenlik ──────────────────────────────────────────────
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache restic && /backup/backup.sh"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      # Meilisearch native snapshot için
      - MEILISEARCH_URL=http://meilisearch:7700
      - MEILISEARCH_API_KEY=${MEILISEARCH_API_KEY}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - OPS_STATUS_DIR=/ops-status
    volumes:
      - uploads:/data/uploads:ro
      - meili_data:/data/meili:ro
      - ./infra/backup:/backup:ro
      - ops_status:/ops-status
    depends_on:
      - postgres

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    restart: unless-stopped
    environment:
      # Caddy HTTP + HTTP saldırı tespiti koleksiyonları
      - COLLECTIONS=crowdsecurity/caddy crowdsecurity/http-dos crowdsecurity/base-http-scenarios
      - GID=1000
    volumes:
      - ./infra/crowdsec/acquis.yaml:/etc/crowdsec/acquis.yaml:ro
      - caddy_logs:/var/log/caddy:ro
      - crowdsec_data:/var/lib/crowdsec/data
      - crowdsec_config:/etc/crowdsec
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "cscli", "version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  restore-check:
    image: alpine:3.21
    profiles: ["ops"]
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache restic && /backup/restore_check.sh"]
    environment:
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - OPS_STATUS_DIR=/ops-status
    volumes:
      - ./infra/backup:/backup:ro
      - ops_status:/ops-status

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
  postgres_data:
    name: fastapi_postgres_data
  redis_data:
    name: fastapi_redis_data
  redis_replica_data:
  sentinel_1_data:
  sentinel_2_data:
  sentinel_3_data:
  meili_data:
    name: fastapi_meili_data
  prometheus_data:
  alertmanager_data:
  grafana_data:
  loki_data:
  uploads:
    name: fastapi_uploads
  ops_status:
  crowdsec_data:
  crowdsec_config:
