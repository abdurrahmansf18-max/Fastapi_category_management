name: fastapi-local

# ── Paylaşılan tanımlar ──────────────────────────────────────────────
x-backend-build: &backend-build
  build:
    context: ./backend
    dockerfile: Dockerfile

x-backend-env: &backend-env
  ENVIRONMENT: development
  DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-docs_platform}
  REDIS_URL: redis://redis:6379/0
  MEILISEARCH_URL: http://meilisearch:7700
  MEILISEARCH_API_KEY: ${MEILISEARCH_API_KEY:-dev-meili-master-key}
  SECRET_KEY: ${SECRET_KEY:-local-dev-secret-change-me}
  APP_PUBLIC_BASE_URL: http://localhost:3000
  API_PUBLIC_PREFIX: /api
  CORS_ORIGINS: '["http://localhost:3000","http://localhost:5173","http://127.0.0.1:3000"]'
  TRUSTED_HOSTS: '["localhost","127.0.0.1","backend"]'
  COOKIE_SECURE: "false"
  COOKIE_SAMESITE: lax
  PUBLIC_CACHE_ETAG_MAX_BYTES: ${PUBLIC_CACHE_ETAG_MAX_BYTES:-262144}
  PLATFORM_OWNER_EMAIL: ${PLATFORM_OWNER_EMAIL:-admin@localhost.dev}
  PLATFORM_OWNER_PASSWORD: ${PLATFORM_OWNER_PASSWORD:-}
  PLATFORM_OWNER_PASSWORD_HASH: ${PLATFORM_OWNER_PASSWORD_HASH:-}
  PLATFORM_OWNER_TOTP_SECRET: ${PLATFORM_OWNER_TOTP_SECRET:-}
  SMTP_HOST: mailhog
  SMTP_PORT: "1025"
  SMTP_USER: ""
  SMTP_PASSWORD: ""
  SMTP_FROM: noreply@localhost
  SMTP_TLS: "false"
  # Ödeme sistemi devre dışı — aktif etmek için uncomment edin
  # IYZICO_API_KEY: ${IYZICO_API_KEY:-}
  # IYZICO_SECRET_KEY: ${IYZICO_SECRET_KEY:-}
  # IYZICO_MERCHANT_ID: ${IYZICO_MERCHANT_ID:-}
  # IYZICO_BASE_URL: ${IYZICO_BASE_URL:-https://sandbox-api.iyzipay.com}
  # IYZICO_SUBSCRIPTION_PLAN_REF: ${IYZICO_SUBSCRIPTION_PLAN_REF:-}
  # IYZICO_CALLBACK_BASE_URL: ${IYZICO_CALLBACK_BASE_URL:-http://localhost:3000}
  SENTRY_DSN: ${SENTRY_DSN:-}
  SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-development}
  SENTRY_RELEASE: ${SENTRY_RELEASE:-docs-platform-dev}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-180}

# ── Servisler ────────────────────────────────────────────────────────
services:
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-docs_platform}
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgbouncer:
    image: edoburu/pgbouncer:latest
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_USER=postgres
      - DB_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - DB_NAME=${POSTGRES_DB:-docs_platform}
      - POOL_MODE=transaction
      - MAX_CLIENT_CONN=500
      - DEFAULT_POOL_SIZE=30
      - AUTH_TYPE=md5
    ports:
      - "6432:5432"
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.12
    restart: unless-stopped
    environment:
      - MEILI_MASTER_KEY=${MEILISEARCH_API_KEY:-dev-meili-master-key}
      - MEILI_ENV=development
    volumes:
      - meili_data:/meili_data
    ports:
      - "7700:7700"

  backend:
    <<: *backend-build
    restart: unless-stopped
    environment:
      <<: *backend-env
      OPS_STATUS_DIR: /ops-status
    volumes:
      - uploads:/app/uploads
      - ops_status:/ops-status:ro
    ports:
      - "8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      pgbouncer:
        condition: service_started

  migrate:
    <<: *backend-build
    restart: "no"
    command: ["python", "run_migration.py"]
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    <<: *backend-build
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "worker", "--loglevel=INFO", "--concurrency=2"]
    environment:
      <<: *backend-env
    volumes:
      - uploads:/app/uploads
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_started
      pgbouncer:
        condition: service_started

  beat:
    <<: *backend-build
    restart: unless-stopped
    command: ["celery", "-A", "app.worker.celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/celerybeat-schedule"]
    environment:
      <<: *backend-env
    depends_on:
      redis:
        condition: service_healthy
      worker:
        condition: service_started
      pgbouncer:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_BACKEND_ORIGIN: http://backend:8000
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NEXT_BACKEND_ORIGIN=http://backend:8000
      - NEXT_INTERNAL_API_BASE=http://backend:8000
      - NEXT_PUBLIC_API_BASE=/api
      - NEXT_PUBLIC_SITE_URL=http://localhost:3000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  # ── Observability (isteğe bağlı: --profile observability) ──────────
  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.55.1
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - backend

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:11.3.1
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  loki:
    profiles: ["observability"]
    image: grafana/loki:3.3.1
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./infra/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki

  promtail:
    profiles: ["observability"]
    image: grafana/promtail:3.3.1
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/promtail.yml"]
    volumes:
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./infra/promtail/promtail.yml:/etc/promtail/promtail.yml:ro
    depends_on:
      - loki

  # ── Operasyonlar (isteğe bağlı: --profile ops) ────────────────────
  backup:
    profiles: ["ops"]
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache restic && /backup/backup.sh"]
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-docs_platform}
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY:-}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - OPS_STATUS_DIR=/ops-status
    volumes:
      - uploads:/data/uploads:ro
      - meili_data:/data/meili:ro
      - ./infra/backup:/backup:ro
      - ops_status:/ops-status
    depends_on:
      - postgres

  restore-check:
    profiles: ["ops"]
    image: alpine:3.21
    entrypoint: ["/bin/sh", "-c", "apk add --no-cache restic && /backup/restore_check.sh"]
    environment:
      - RESTIC_REPOSITORY=${RESTIC_REPOSITORY:-}
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:-}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - OPS_STATUS_DIR=/ops-status
    volumes:
      - ./infra/backup:/backup:ro
      - ops_status:/ops-status

volumes:
  postgres_data:
    name: fastapi_local_postgres_data
  redis_data:
    name: fastapi_local_redis_data
  meili_data:
    name: fastapi_local_meili_data
  prometheus_data:
  grafana_data:
  loki_data:
  uploads:
    name: fastapi_local_uploads
  ops_status:
