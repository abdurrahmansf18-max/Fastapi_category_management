name: ci

on:
  push:
    branches:
      - main
      - saas-modeli
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Audit backend dependencies
        run: |
          python -m pip install pip-audit
          python -m pip_audit -r backend/requirements-dev.txt
      - name: Compile backend
        run: python -m compileall backend
      - name: Check DDL snapshot drift
        env:
          PYTHONPATH: backend
        run: python backend/scripts/generate_schema_sql.py --check
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: pytest backend/tests
      - name: Import FastAPI app
        run: python -c "import sys; sys.path.insert(0, 'backend'); import main; print(main.app.title)"

  migration-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: docs_smoke
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d docs_smoke"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run database migrations against Postgres
        env:
          PYTHONPATH: backend
          ENVIRONMENT: development
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/docs_smoke
        run: python backend/run_migration.py
      - name: Verify migrated schemas
        env:
          PYTHONPATH: backend
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/docs_smoke
        run: |
          python - <<'PY'
          import asyncio
          import os

          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          from app.db.provisioning import provision_tenant_schema

          async def main() -> None:
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.begin() as conn:
                  rows = await conn.execute(
                      text(
                          """
                          SELECT table_name
                          FROM information_schema.tables
                          WHERE table_schema = 'public'
                          """
                      )
                  )
                  tables = {row[0] for row in rows}
                  required = {"alembic_version", "plan", "tenant", "user_account", "audit_event"}
                  missing = required - tables
                  if missing:
                      raise SystemExit(f"Missing public tables after migration: {sorted(missing)}")

                  version = await conn.scalar(text("SELECT version_num FROM public.alembic_version"))
                  if version != "0001":
                      raise SystemExit(f"Unexpected Alembic version: {version!r}")

              await engine.dispose()

              await provision_tenant_schema("tenant_smoke", "Smoke Tenant")

              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.begin() as conn:
                  rows = await conn.execute(
                      text(
                          """
                          SELECT table_name
                          FROM information_schema.tables
                          WHERE table_schema = 'tenant_smoke'
                          """
                      )
                  )
                  tenant_tables = {row[0] for row in rows}
                  required_tenant = {"category", "heading", "content", "site_setting"}
                  missing_tenant = required_tenant - tenant_tables
                  if missing_tenant:
                      raise SystemExit(f"Missing tenant tables after provisioning: {sorted(missing_tenant)}")
              await engine.dispose()

          asyncio.run(main())
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit high severity packages
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run mobile smoke tests
        working-directory: frontend
        run: npm run test:e2e

  containers-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker compose config
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build backend image
        run: docker build -t docs-platform-backend:test ./backend
      - name: Build frontend image
        run: docker build --build-arg NEXT_BACKEND_ORIGIN=http://backend:8000 -t docs-platform-frontend:test ./frontend
      - name: Cache Trivy vulnerability database
        uses: actions/cache@v4
        with:
          path: .trivycache
          key: trivy-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-${{ runner.os }}-
      - name: Scan backend image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivycache:/root/.cache/" \
            aquasec/trivy:0.69.3 image \
            --scanners vuln \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-version-check \
            --no-progress \
            docs-platform-backend:test
      - name: Scan frontend image with Trivy
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$PWD/.trivycache:/root/.cache/" \
            aquasec/trivy:0.69.3 image \
            --scanners vuln \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --skip-version-check \
            --no-progress \
            docs-platform-frontend:test
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
