name: ci

on:
  push:
    branches:
      - main
      - saas-modeli
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall backend
      - name: Run backend tests
        env:
          PYTHONPATH: backend
        run: pytest backend/tests
      - name: Import FastAPI app
        run: python -c "import sys; sys.path.insert(0, 'backend'); import main; print(main.app.title)"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Audit high severity packages
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run mobile smoke tests
        working-directory: frontend
        run: npm run test:e2e

  containers-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docker compose config
        run: docker compose -f docker-compose.prod.yml config --quiet
      - name: Build backend image
        run: docker build -t docs-platform-backend:test ./backend
      - name: Build frontend image
        run: docker build --build-arg NEXT_BACKEND_ORIGIN=http://backend:8000 -t docs-platform-frontend:test ./frontend
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
